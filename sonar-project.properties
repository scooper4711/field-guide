sonar.projectKey=scooper4711_field-guide
sonar.organization=scooper4711

sonar.sources=Sources,scripts,ios/App,.github
sonar.tests=Tests,ios/UITests
sonar.sourceEncoding=UTF-8

# Written by scripts/coverage.sh from the test run's coverage data.
sonar.coverageReportPaths=coverage/sonar-coverage.xml

# SwiftUI views, the entry points and the build tools are not unit tested; the logic lives in FieldGuideKit and
# CompendiumImport, which is what the coverage gate measures.
sonar.coverage.exclusions=Sources/FieldGuideUI/**,Sources/FieldGuide/**,Sources/FieldGuideImport/**,\
  scripts/**,ios/**
